services:
  app:
    build: .
    env_file:
      - .env
    ports:
      - "8787:8787"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  mongo:
    image: mongo:8
    command: ["mongod", "--bind_ip_all"]
    environment:
      MONGO_INITDB_DATABASE: sadik_travels
    volumes:
      - sadik_mongodata:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - sadik_redisdata:/data
    restart: unless-stopped

volumes:
  sadik_mongodata:
  sadik_redisdata:
