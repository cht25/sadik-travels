<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You are offline · Sadik Travels</title>
  <meta name="theme-color" content="#1438b8" />
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#17253b;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    .card{width:min(440px,calc(100% - 36px));padding:38px 30px;text-align:center;background:#fff;border:1px solid #e3e8f0;border-radius:18px;box-shadow:0 24px 70px rgba(16,36,80,.12)}
    .logo{width:96px;height:auto}
    .code{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:#1438b8;font-weight:800;margin-top:14px}
    h1{font-size:26px;line-height:1.2;margin:10px 0 8px}
    p{color:#68758a;font-size:13px;line-height:1.6;margin:0 auto 24px}
    a{display:inline-flex;padding:11px 18px;border-radius:8px;text-decoration:none;font-size:13px;font-weight:800;background:#1438b8;color:#fff}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/assets/sadik-travels-logo.png?v=3" alt="Sadik Travels" />
    <div class="code">You are offline</div>
    <h1>No internet connection</h1>
    <p>Sadik Travels needs a connection to show live availability and prices. Check your network and try again — your saved pages remain available.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
